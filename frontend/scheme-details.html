<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scheme Details - SGSP</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .details-container {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .back-link {
    display: inline-block;
    margin-bottom: 20px;
    color: #2b6cb0;
    text-decoration: none;
  }
  .details-card {
    background: #fff;
    border-radius: 10px;
    padding: 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .details-card h1 {
    margin-bottom: 10px;
  }
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin: 25px 0;
  }
  .info-box {
    background: #f5f7fa;
    padding: 15px;
    border-radius: 8px;
  }
  .info-box span {
    display: block;
    font-size: 12px;
    color: #777;
  }
  .info-box strong {
    font-size: 16px;
    color: #1a1a2e;
  }
  .section-title {
    margin-top: 25px;
    margin-bottom: 10px;
    font-size: 18px;
  }
  ul.doc-list {
    padding-left: 20px;
  }
  ul.doc-list li {
    margin-bottom: 6px;
  }
  .apply-btn {
    display: inline-block;
    margin-top: 25px;
    background: #2b6cb0;
    color: #fff;
    padding: 12px 30px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 500;
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">SGSP</div>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="schemes.html">Schemes</a></li>
    <li><a href="eligibility.html">Eligibility Check</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
    <li><a href="about.html">About Us</a></li>
  </ul>
  <div class="translate-container">
    <div id="google_translate_element"></div>
    <a href="login.html" class="login-btn" style="margin-left:10px;">Login</a>
  </div>
</nav>

<div class="details-container">
  <a href="schemes.html" class="back-link">← Back to Schemes</a>
  <div class="details-card" id="detailsCard">
    Loading...
  </div>
</div>

<script src="js/scheme-details.js"></script>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {
        pageLanguage: 'en',
        includedLanguages: 'en,hi,te',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      },
      'google_translate_element'
    );
  }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
