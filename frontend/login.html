<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - SGSP</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-container {
    max-width: 400px;
    margin: 80px auto;
    padding: 0 20px;
  }
  .auth-card {
    background: #fff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .auth-card h2 {
    margin-bottom: 20px;
    text-align: center;
  }
  .form-group {
    margin-bottom: 15px;
  }
  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 500;
  }
  .form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  .auth-btn {
    width: 100%;
    background: #2b6cb0;
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    margin-top: 10px;
  }
  .error-msg {
    color: #a52a1a;
    font-size: 13px;
    margin-bottom: 10px;
    text-align: center;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">SGSP</div>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="schemes.html">Schemes</a></li>
    <li><a href="eligibility.html">Eligibility Check</a></li>
  </ul>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <h2>Admin Login</h2>
    <p class="error-msg hidden" id="loginError"></p>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUsername" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="auth-btn">Login</button>
    </form>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
