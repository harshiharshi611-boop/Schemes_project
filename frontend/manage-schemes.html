<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manage Schemes - SGSP</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .manage-container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .add-btn {
    background: #2b6cb0;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  th, td {
    padding: 12px 15px;
    text-align: left;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  th {
    background: #f5f7fa;
  }
  .action-btn {
    padding: 5px 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    margin-right: 5px;
  }
  .edit-btn { background: #e6f0fa; color: #2b6cb0; }
  .delete-btn { background: #fdecea; color: #a52a1a; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    width: 450px;
    max-width: 90%;
  }
  .modal-box h3 { margin-bottom: 15px; }
  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block;
    margin-bottom: 5px;
    font-size: 13px;
    font-weight: 500;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
  }
  .save-btn { background: #2b6cb0; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; flex: 1; }
  .cancel-btn { background: #eee; color: #333; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; flex: 1; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">SGSP</div>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="schemes.html">Schemes</a></li>
    <li><a href="eligibility.html">Eligibility Check</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
  </ul>
</nav>

<div class="manage-container">
  <div class="top-bar">
    <h1>Manage Schemes</h1>
    <button class="add-btn" onclick="openModal()">+ Add New Scheme</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Category</th>
        <th>Benefit</th>
        <th>Income Limit</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="schemeTableBody"></tbody>
  </table>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle">Add New Scheme</h3>
    <form id="schemeForm">
  <input type="hidden" id="schemeId">
  <div class="form-group">
    <label>Title</label>
    <input type="text" id="title" required>
  </div>
  <div class="form-group">
    <label>Category</label>
    <select id="categoryId" required></select>
  </div>
  <div class="form-group">
    <label>Description</label>
    <textarea id="description" rows="3"></textarea>
  </div>
  <div class="form-group">
    <label>Benefit Amount</label>
    <input type="text" id="benefitAmount" placeholder="e.g. Up to ₹50,000">
  </div>
  <div class="form-group">
    <label>Income Limit (leave blank if none)</label>
    <input type="number" id="incomeLimit">
  </div>
  <div class="form-group">
    <label>Department</label>
    <input type="text" id="department">
  </div>
  <div class="form-group">
    <label>Official Website Link</label>
    <input type="url" id="officialUrl" placeholder="https://example.gov.in">
  </div>
  <div class="form-group">
    <label>Application Mode</label>
    <select id="applicationMode">
      <option value="Online">Online</option>
      <option value="Offline">Offline</option>
      <option value="Online & Offline">Online & Offline</option>
    </select>
  </div>
  <div class="form-group">
    <label>Eligibility Criteria (one point per line)</label>
    <textarea id="eligibilityCriteria" rows="3" placeholder="SC/ST/OBC students&#10;Studying in recognized institutions&#10;Annual family income up to ₹2.5 Lakh"></textarea>
  </div>
  <div class="form-group">
    <label>Key Benefits (one point per line)</label>
    <textarea id="keyBenefits" rows="3" placeholder="Tuition fee reimbursement&#10;Maintenance allowance&#10;Additional support for hostellers"></textarea>
  </div>
  <div class="form-group">
    <label>Required Documents (one per line)</label>
    <textarea id="requiredDocuments" rows="3" placeholder="Aadhaar Card&#10;Caste Certificate&#10;Income Certificate"></textarea>
  </div>
  <div class="modal-actions">
    <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
    <button type="submit" class="save-btn">Save</button>
  </div>
</form>
  </div>
</div>

<script src="js/manage-schemes.js"></script>
</body>
</html>
