<head>

<title>Eligibility Results - SGSP</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .results-container {
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .result-banner {
    background: #e6f7ec;
    color: #1a7a3c;
    padding: 15px 20px;
    border-radius: 8px;
    margin-bottom: 25px;
    font-weight: 500;
  }
  .result-card {
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .result-info h3 {
    margin-bottom: 5px;
  }
  .result-info p {
    color: #555;
    font-size: 14px;
    margin-bottom: 8px;
  }
  .benefit-tag {
    font-weight: bold;
    color: #1a1a2e;
  }
  .note-box {
    font-size: 13px;
    color: #888;
    margin-top: 20px;
    text-align: center;
  }
</style>
</head>

<nav class="navbar">
  <div class="logo">SGSP</div>
  <ul>
    <li><a href="index.html">Home</a></li>

    <li><a href="eligibility.html">Eligibility Check</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
    <li><a href="about.html">About Us</a></li>
  </ul>
  <div class="translate-container">
    <div id="google_translate_element"></div>
    <a href="login.html" class="login-btn" style="margin-left:10px;">Login</a>
  </div>
</nav>

<div class="results-container">
  <div class="result-banner" id="resultBanner">Loading results...</div>

</div>

<script src="js/results.js"></script>
